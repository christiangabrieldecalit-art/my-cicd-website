<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps CI/CD Lab</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 50px 20px;
      background-color: #f4f4f9;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 20px;
    }

    .status {
      background-color: #27ae60;
      color: white;
      padding: 12px 24px;
      border-radius: 20px;
      display: inline-block;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .feature-card {
      background-color: #ffffff;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border-left: 4px solid #27ae60;
      text-align: left;
    }

    .feature-card h3 {
      margin-top: 0;
      color: #2c3e50;
    }

    .feature-card p {
      margin-bottom: 0;
      color: #555;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Example Project for DevOps CI/CD Pipeline</h1>
    <p class="status">Version 2.0: Automated Testing &amp; Deployment Active!</p>

    <div class="feature-card">
      <h3>New Feature Added</h3>
      <p>Pushed from local environment, verified by automated tests, and deployed live!</p>
    </div>
  </div>
</body>
</html>
